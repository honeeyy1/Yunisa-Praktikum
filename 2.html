<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Kalkulator Sederhana</title>
</head>
<body>
  <h2>Kalkulator Sederhana</h2>
  <label>Bilangan 1: </label>
  <input type="number" id="bil1" /><br /><br />
  <label>Bilangan 2: </label>
  <input type="number" id="bil2" /><br /><br />

  <button onclick="hitung('+')">+</button>
  <button onclick="hitung('-')">-</button>
  <button onclick="hitung('*')">x</button>
  <button onclick="hitung('/')">/</button><br /><br />

  <label>Hasil: </label>
  <input type="text" id="hasil" readonly />

  <script>
    function hitung(operator) {
      const a = parseFloat(document.getElementById("bil1").value);
      const b = parseFloat(document.getElementById("bil2").value);
      let hasil = "";

      switch (operator) {
        case '+': hasil = a + b; break;
        case '-': hasil = a - b; break;
        case '*': hasil = a * b; break;
        case '/': hasil = b !== 0 ? a / b : "Tidak bisa dibagi 0"; break;
        default: hasil = "Operator tidak dikenal";
      }

      document.getElementById("hasil").value = hasil;
    }
  </script>

  <script language="JavaScript">
    document.write("Dimodifikasi terakhir pada " + document.lastModified);
  </script>
</body>
</html>
