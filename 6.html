<!DOCTYPE html>
<html>
    <head>
        <style>
            table, th, td {
                border: 1px solid black;
                border-collapse: collapse;
            }
            table.names {
                width: 100%;
                background-color: #f1f1c1;
            }
        </style>
    </head>
    <body>
        <table style="width: 100%">
            <tr>
                <th>first name</th>
                <th>last name</th>
                <th>age</th>
            </tr>
            <tr>
            <td>Novya</td>
            <td>selena</td>
            <td>18</td>
            </tr>
        </table>

        <br>

        <table class="names">
            <tr>
                <th>first name</th>
                <th>last name</th>
                <th>age</th>
                <tr>
                    <td>Novya</td>
                    <td>selena</td>
                    <td>18</td>
                </tr>
            </tr>
        </table>
    </body>
</html>
