<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Konversi Nilai Angka ke Huruf</title>
</head>
<body>
  <h2>Konversi Nilai Angka ke Nilai Huruf</h2>
  <label for="nilai">Masukkan Nilai (0-100): </label>
  <input type="number" id="nilai" min="0" max="100" />
  <button onclick="konversiNilai()">Konversi</button>
  <p>Nilai Huruf: <span id="hasil"></span></p>

  <script>
    function konversiNilai() {
      const nilai = parseInt(document.getElementById("nilai").value);
      let huruf = "";

      if (nilai >= 0 && nilai <= 40) huruf = "E";
      else if (nilai <= 55) huruf = "D";
      else if (nilai <= 60) huruf = "C";
      else if (nilai <= 65) huruf = "BC";
      else if (nilai <= 70) huruf = "B";
      else if (nilai <= 80) huruf = "AB";
      else if (nilai <= 100) huruf = "A";
      else huruf = "Nilai tidak valid";

      document.getElementById("hasil").textContent = huruf;
    }
  </script>

  <script language="JavaScript">
    document.write("Dimodifikasi terakhir pada " + document.lastModified);
  </script>
</body>
</html>
